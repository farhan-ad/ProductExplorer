<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Explorer</title>

    <link rel="stylesheet" href="style.css" />
    <script src="cart.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-brand">
        <h1><a href="index.html">Product Explorer</a></h1>
        <p>Explore and discover products easily.</p>
      </div>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Shop</a>
        <a href="cart.html">Cart</a>
      </nav>
    </header>
    <main>
      <h2>Products</h2>
      <div class="product-filters">
        <div class="filter-field filter-field-search">
          <label for="product-search">Search products</label>
          <input
            type="search"
            placeholder="Search by product name"
            id="product-search"
          />
        </div>

        <div class="filter-field">
          <label for="product-category">Category</label>
          <select id="product-category">
            <option value="">All categories</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="product-sort">Sort by</label>
          <select id="product-sort">
            <option value="default">Default order</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
        </div>
      </div>

      <p id="product-status" role="status"></p>

      <div
        class="price-range-filters"
        role="group"
        aria-label="Filter product by price range"
      >
        <div class="filter-field">
          <label for="product-min-price">Minimum price (₹)</label>
          <input
            id="product-min-price"
            type="number"
            min="0"
            step=".01"
            inputmode="decimal"
            placeholder="No minimum"
            aria-describedby="price-filter-error"
          />
        </div>
        <div class="filter-field">
          <label for="product-max-price">Maximum price (₹)</label>
          <input
            id="product-max-price"
            type="number"
            min="0"
            step=".01"
            inputmode="decimal"
            placeholder="No maximum"
            aria-describedby="price-filter-error"
          />
        </div>

        <button id="clear-price-range" type="button">Clear price range</button>

        <p id="price-filter-error" class="filter-error" role="alert" hidden></p>
      </div>

      <button id="reload-products" type="button">Reload products</button>

      <ul id="product-list"></ul>
    </main>
  </body>
</html>
